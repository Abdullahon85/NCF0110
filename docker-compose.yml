# NCF: ONE container = site + admin panel + REST API (Django/gunicorn) + SQLite.
#   cp .env.docker.example .env      # fill SECRET_KEY and ALLOWED_HOSTS
#   docker compose up -d --build
#   docker compose exec ncf python manage.py createsuperuser
# All data (SQLite database + uploaded images) is in the "ncf-data" volume (/data).
# Registry workflow (build machine -> registry -> server):
#   build machine: ./deploy/push-images.sh registry.example.uz:5000
#   server:        docker compose pull && docker compose up -d

services:
  ncf:
    build: .
    image: ${REGISTRY:-ncf}/ncf:${TAG:-latest}
    env_file: .env
    environment:
      # Fixed by the image/volume layout (not meant to be changed in .env):
      SQLITE_PATH: /data/db.sqlite3
      MEDIA_ROOT: /data/media
    ports:
      - "${HTTP_PORT:-8080}:8000"     # site + admin panel + /api + /media
    volumes:
      - ncf-data:/data                # DATABASE AND IMAGES: never delete this volume
    restart: unless-stopped

volumes:
  ncf-data:
