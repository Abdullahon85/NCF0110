# nginx inside the "frontend" container (see docker-compose.yml).
# TLS is expected to terminate in front of this container (the server's reverse proxy).

# Keep the scheme reported by an outer proxy; fall back to this connection's scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 12m;            # image uploads up to 10 MB

    root /usr/share/nginx/html;
    index index.html;

    # Backend (Django/gunicorn). X-Forwarded-For is APPENDED: the backend's
    # TRUSTED_PROXY_COUNT must equal the number of proxies in front of it
    # (1 = only this nginx; 2 = the server's reverse proxy + this nginx).
    location ~ ^/(api|dashboard-ctrl-panel|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Uploaded images: shared "media" volume, written by the backend.
    location /media/ {
        alias /usr/share/nginx/media/;
        add_header X-Content-Type-Options nosniff;
        expires 7d;
    }

    # Built assets have content hashes in their names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: every Vue route returns index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
